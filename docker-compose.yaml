services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/marketplace
      DB_USERNAME: postgres
      DB_PASSWORD: root
    depends_on:
      - db

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"